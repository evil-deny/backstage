  <style>

    input:focus,select:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
    .custom-panel{padding:12px;margin-bottom:12px}

    .custom-grid{display:grid;grid-template-columns:minmax(0,1.5fr) 120px 100px auto;gap:8px;align-items:end}
    .custom-list{display:grid;gap:8px;margin-top:10px}

    .category-count{color:var(--muted);font-size:17px;font-weight:700}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}

    .item img{width:82px;height:82px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#f1f5f9;cursor:zoom-in}.item h3{margin:0;font-size:21px;line-height:1.35;word-break:break-word}

    .bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:10px 12px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(15,23,42,.08)}

    .checkout,.primary{min-height:52px;padding:0 18px;background:var(--main);color:#fff}.checkout{min-height:62px;font-size:22px}.danger{min-height:48px;padding:0 15px;background:var(--red);color:#fff}.blue{min-height:48px;padding:0 15px;background:var(--blue);color:#fff}
    .modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);padding:12px;align-items:center;justify-content:center}.modal.show{display:flex}.modal-card{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(15,23,42,.25)}
    .modal-head{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:21px}.close{width:40px;height:40px;background:#e2e8f0}
    .modal-body{padding:16px}.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.line-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end}.line-actions button{width:36px;height:36px;background:#e2e8f0}.line-actions .remove{background:#fee2e2;color:#991b1b;width:auto;padding:0 10px}.receipt-list,.pick-list{display:grid;gap:8px;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .admin-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}.tab{min-height:52px;background:#e2e8f0;color:#243244}.tab.active{background:var(--main);color:#fff}.admin-view{display:none}.admin-view.active{display:block}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.metric{padding:14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.metric span{color:var(--muted);font-size:13px;font-weight:800}.metric strong{display:block;margin-top:7px;font-size:25px}
    .order-card,.inventory-row{display:grid;gap:10px;padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.order-title{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.badge{display:inline-flex;align-items:center;min-height:26px;padding:2px 9px;border-radius:99px;background:#dbeafe;color:#1d4ed8;font-size:13px;font-weight:900}.badge.shipped{background:#dcfce7;color:#166534}.badge.returned{background:#fee2e2;color:#991b1b}.badge.done{background:#dcfce7;color:#166534}
    .check{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.check input{width:20px;min-height:20px;accent-color:var(--main)}
    .return-grid{display:grid;gap:8px}.return-line{display:grid;grid-template-columns:24px minmax(0,1fr) 90px;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.return-line input[type=checkbox]{width:20px;min-height:20px}.inventory-row{grid-template-columns:1fr;gap:12px;overflow:hidden}.inventory-main{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.inventory-stats{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:flex-start}.inventory-stat{display:grid;gap:3px;min-width:88px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.inventory-stat strong{font-size:22px}.stock-controls{display:grid;grid-template-columns:42px 72px 42px;gap:6px}.stock-controls button{width:42px;height:42px;background:#e2e8f0}.stock-controls input{text-align:center;font-weight:900;padding:4px}
    .category-manager{display:grid;gap:10px;margin-bottom:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.category-tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.inventory-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-start}.add-product-grid{display:grid;gap:8px;align-items:center;grid-template-columns:1.2fr 110px 1fr 110px 1fr auto}.field-label{font-size:15px;font-weight:900;color:#475569}.inventory-thumb{width:78px;height:78px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:cover;cursor:zoom-in}.inventory-large-image{display:none;width:min(360px,100%);max-height:360px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff}.inventory-row.previewing .inventory-large-image{display:block}.inventory-form input,.inventory-form select,.add-product-grid input,.add-product-grid select{min-height:44px;padding:6px 8px;font-size:16px}.inventory-form select{width:150px}.inventory-form select+select{width:190px}.inventory-form input[type=number]{width:110px}.inventory-form input[data-image-input]{width:min(260px,100%);flex:1 1 220px}.inventory-form input[type=file]{width:156px;padding:9px 8px;background:#fff}.inventory-form .danger{width:120px}.image-modal-card{width:min(920px,100%);background:#0f172a;border-radius:12px;overflow:hidden}.image-modal-card .modal-head{background:#0f172a;color:#fff;border-bottom:1px solid rgba(255,255,255,.15)}.image-modal-card .close{background:#334155;color:#fff}.image-preview{display:block;max-width:100%;max-height:82vh;margin:0 auto;object-fit:contain;background:#0f172a}
    .empty{padding:24px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px;background:#f8fafc}
    @media print{
      body{background:#fff}
      .topbar,.wrap,.bottom-bar,.modal:not(#receiptModal),#receiptModal .modal-head,#receiptModal .actions{display:none!important}
      #receiptModal{display:block!important;position:static;background:#fff;padding:0}
      #receiptModal .modal-card{width:100%;max-height:none;overflow:visible;box-shadow:none;border-radius:0}
      #receiptModal .modal-body{padding:0}
      #receiptContent{padding:12px;color:#000}
      .line{break-inside:avoid;background:#fff;border-color:#999}
      .screen-receipt{display:none!important}
      .print-receipt{display:block!important}
      .print-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:16px}
      .print-table th,.print-table td{border:1px solid #333;padding:8px;text-align:left}
      .print-table th{background:#eee}
      .print-table td:nth-child(2),.print-table td:nth-child(3),.print-table td:nth-child(4),.print-table th:nth-child(2),.print-table th:nth-child(3),.print-table th:nth-child(4){text-align:right}
      .print-total{font-size:24px;font-weight:bold;text-align:right;margin-top:14px;padding:10px;border:2px solid #111}
    }
    .receipt-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
    .table-wrap{overflow-x:auto}
    .receipt-title{padding:16px;background:#eef5f5;text-align:center}
    .receipt-title h3{margin:0;font-size:24px}
    .receipt-info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px;border-bottom:1px solid var(--line)}
    .receipt-info div{padding:9px 10px;background:#f8fafc;border-radius:8px}
    .receipt-table{width:100%;border-collapse:collapse}
    .receipt-table th,.receipt-table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    .receipt-table th{background:#f8fafc;color:var(--muted);font-size:13px}
    .receipt-table td:nth-child(2),.receipt-table td:nth-child(3),.receipt-table td:nth-child(4),.receipt-table th:nth-child(2),.receipt-table th:nth-child(3),.receipt-table th:nth-child(4){text-align:right;white-space:nowrap}
    .receipt-edit{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
    .receipt-edit button{width:34px;height:34px;background:#e2e8f0}
    .receipt-edit .remove{width:auto;padding:0 10px;background:#fee2e2;color:#991b1b}
    .receipt-total-row{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:14px;padding:14px 16px;font-size:24px;font-weight:900;background:#fff7ed;border:2px solid #f59e0b;border-radius:10px;color:#9a3412}
    @media(max-width:760px){.topbar{padding:12px;align-items:flex-start}.brand img{width:48px;height:48px}.brand strong{font-size:22px}.wrap{padding-bottom:132px}.customer-box,.search-row,.items,.bottom-inner,.metrics,.inventory-row,.inventory-main,.inventory-stats,.inventory-form,.custom-grid,.receipt-info,.category-tools,.add-product-grid{grid-template-columns:1fr}.search-row{top:65px}.main-tabs{grid-template-columns:1fr}.item{grid-template-columns:76px minmax(0,1fr);padding:9px}.item img{width:76px;height:76px}.item h3{font-size:20px}.checkout{width:100%}.admin-tabs{grid-template-columns:1fr}.modal-body{padding:12px}.line{grid-template-columns:1fr}.line-actions{justify-content:flex-start}.return-line{grid-template-columns:24px minmax(0,1fr)}.receipt-table th:nth-child(2),.receipt-table td:nth-child(2){display:none}.receipt-table th,.receipt-table td{padding:9px 8px}}

    .main-tab{font-size:24px;min-height:60px}

<body>
  <header class="topbar">
    <div class="brand"><img src="assets/logo.jpg" alt="福緣素食 logo"><div><strong>福緣訂單系統</strong><span>輸入大名，選品項，確認後送出</span></div></div>
    <button class="admin-open" id="openAdmin" hidden>後台</button>
  </header>

  <main class="wrap">
    <div class="main-tabs">
      <button class="main-tab active" data-main-view="orderPage">訂購</button>
      <button class="main-tab" data-main-view="shipPage">出貨</button>
      <button class="main-tab" data-main-view="returnPage">退貨</button>
    </div>

    <div class="order-sync"><span id="orderSyncStatus" role="status">訂單每 15 秒同步</span><button class="secondary" id="refreshOrders">更新訂單 ↻</button></div>
    <section class="main-view active" id="orderPage">
      <section class="box customer-box">
        <label>大名<input id="customerName" autocomplete="name" placeholder="請輸入大名"></label>
        <label>備註<input id="customerNote" placeholder="例：不要辣、分開裝、晚點取"></label>
      </section>

      <section class="custom-panel">
        <strong>客製化品項</strong>
        <div class="custom-grid" style="margin-top:10px">
          <label>品名<input id="customName" placeholder="例：代購商品、特別組合"></label>
          <label>單價<input id="customPrice" type="number" min="0" inputmode="numeric" placeholder="0"></label>
          <label>數量<input id="customQty" type="number" min="1" inputmode="numeric" value="1"></label>
          <button class="blue" id="addCustom">新增</button>
        </div>
        <div class="custom-list" id="customList"></div>
      </section>

      <section class="search-row">
        <input id="search" type="search" placeholder="搜尋品項名稱">
        <select id="categoryFilter" aria-label="分類篩選"></select>
      </section>
      <div id="productList"></div>
    </section>

    <section class="main-view" id="shipPage"></section>
    <section class="main-view" id="returnPage"></section>
  </main>

  <footer class="bottom-bar"><div class="bottom-inner"><div class="total">合計 <strong id="cartTotal">$0</strong></div><button class="checkout" id="checkout">確認訂單</button></div></footer>

  <section class="modal" id="receiptModal"><div class="modal-card"><div class="modal-head"><h2>訂單確認</h2><button class="close" data-close="receiptModal">×</button></div><div class="modal-body"><div id="receiptContent"></div><div class="actions"><button class="secondary" data-close="receiptModal">返回修改</button><button class="blue" id="printReceipt">影印明細</button><button class="blue" id="shareReceiptImage">圖片分享</button><button class="primary" id="saveOrder">送出訂單</button></div></div></div></section>
  <section class="modal" id="imageModal"><div class="image-modal-card"><div class="modal-head"><h2 id="imageModalTitle">商品圖片</h2><button class="close" data-close="imageModal">×</button></div><img id="imagePreview" class="image-preview" src="" alt=""></div></section>
  <section class="modal" id="adminLogin"><div class="modal-card" style="max-width:420px"><div class="modal-head"><h2>後台登入</h2><button class="close" data-close="adminLogin">×</button></div><div class="modal-body"><label>密碼<input id="adminPassword" type="password" inputmode="numeric" placeholder="請輸入密碼"></label><div class="actions"><button class="primary" id="loginAdmin">進入後台</button></div></div></div></section>
  <section class="modal" id="adminPanel"><div class="modal-card"><div class="modal-head"><h2>後台管理</h2><button class="close" data-close="adminPanel">×</button></div><div class="modal-body"><div class="admin-tabs"><button class="tab active" data-admin-tab="overview">總覽</button><button class="tab" data-admin-tab="dailySummary">日品項統計</button><button class="tab" data-admin-tab="inventory">庫存</button></div><div class="admin-view active" id="overview"></div><div class="admin-view" id="dailySummary"></div><div class="admin-view" id="inventory"></div></div></div></section>

  <script src="/cloud-sync.js"></script>
  <script type="module">
    import {orderLabel,sourceLabel,sourceClass} from "/order-display.js";
    import {catalogOrder} from "/catalog-order.js";
    await FuyuanCloud.ready;
    document.addEventListener("keydown",e=>{if(e.target.matches("[data-image-open]")&&["Enter"," "].includes(e.key)){e.preventDefault();e.target.click();}});
    const PRODUCTS=await FuyuanCloud.loadProducts('order');
    const CLOUD_ORDERS=await FuyuanCloud.request('/staff/orders').catch(e=>{FuyuanCloud.notice('訂單尚未同步，請按「更新訂單」重試。');return [];});
    // Authentication is enforced by the shared API, not by a browser password.
    const STORE_KEY = "clearOrderSystemV3";
    const PLACEHOLDER = "https://evil-deny.github.io/order/assets/logo.jpg";
    const STORAGE_OPTIONS = ["冷凍","冷藏","乾貨"];
    const DEFAULT_TYPE_OPTIONS = ["湯品/鍋物","丸類/火鍋料","素肉/調理肉品","海味/魚蝦類","糕餅/點心","麵食","小菜類","豆製品","蔬菜/菇類","醬料","素鬆/鬆類","包材/耗材","公司庫存其他","其他訂購品"];
    const state = loadState();
    let standardCart = {};
    let customCart = [];
    let pendingOrder = null;
    let inventoryKeyword = "";

    function loadState(){
      return {orders:normalizeCloudOrders(CLOUD_ORDERS),stock:Object.fromEntries(PRODUCTS.map(p=>[p.id,p.stock])),categoryOverrides:Object.fromEntries(PRODUCTS.map(p=>[p.id,{storage:p.storage,type:p.type}])),categoryOptions:[...new Set(PRODUCTS.map(p=>p.type))],hiddenCategoryOptions:[],productEdits:{},customProducts:[],deletedProductIds:[]};
    }
    function saveState(){ FuyuanCloud.notice('商品與庫存請在共用後台管理。'); }
    function attrText(v){ return String(v||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;"); }
    function cssText(v){ return attrText(v).replaceAll("'","&#39;"); }
    function money(v){ return "$" + Number(v || 0).toLocaleString("zh-TW"); }
    function nowText(){ return new Date().toLocaleString("zh-TW",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}); }
    function dateKey(date){ return date.toISOString().slice(0,10); }
    function orderDate(order){ return order.createdAtISO ? new Date(order.createdAtISO) : new Date(); }
    function rawProduct(id){ return [...PRODUCTS,...(state.customProducts||[])].find(p => p.id === id); }
    function product(id){
      const base=rawProduct(id);
      if(!base) return {id,name:"已刪除品項",category:"已刪除",price:0,image:PLACEHOLDER,stock:0};
      const edit=state.productEdits[id]||{};
      return {...base,price:edit.price ?? base.price,image:edit.image ?? base.image};
    }
    function activeProducts(){
      const deleted=state.deletedProductIds||[];
      return [...PRODUCTS,...(state.customProducts||[])].filter(p=>p.orderVisible!==false && !deleted.includes(p.id)).map(p=>product(p.id));
    }
    function itemName(item){ return attrText(item.name || product(item.id).name); }
    function itemPrice(item){ return Number.isFinite(item.price) ? item.price : product(item.id).price; }
    function itemUnit(item){ return attrText(item.unit??"件"); }
    function itemSubtotal(item){ return itemPrice(item) * item.qty; }
    function openModal(id){ document.getElementById(id).classList.add("show"); }
    function closeModal(id){ document.getElementById(id).classList.remove("show"); }

    function cartItems(){
      const standard = activeProducts().map(p => ({id:p.id,name:p.name,price:p.price,unit:p.unit??"件",qty:Number(standardCart[p.id] || 0),custom:false})).filter(i => i.qty > 0);
      return [...standard, ...customCart.map(i => ({...i}))];
    }
    function orderTotal(order){ return order.items.reduce((sum,i)=>sum+itemSubtotal(i),0); }
    function shippedQty(item){ return item.picked ? item.qty : 0; }
    function shippedSubtotal(item){ return itemPrice(item) * shippedQty(item); }
    function orderGross(order){
      if(order.status==="shipped" || order.status==="returned") return order.items.reduce((sum,i)=>sum+shippedSubtotal(i),0);
      return orderTotal(order);
    }
    function returnedTotal(order){ return (order.returns||[]).reduce((sum,i)=>sum+itemSubtotal(i),0); }
    function orderNet(order){ return orderGross(order)-returnedTotal(order); }
    function soldQty(productId){
      return state.orders.reduce((sum,o)=>{
        if(o.status!=="shipped" && o.status!=="returned") return sum;
        const sold=o.items.filter(i=>!i.custom && i.id===productId).reduce((n,i)=>n+shippedQty(i),0);
        const ret=(o.returns||[]).filter(i=>!i.custom && i.id===productId).reduce((n,i)=>n+i.qty,0);
        return sum+sold-ret;
      },0);
    }
    function statusText(s){ return {cancelled:"已取消",new:"待出貨",picking:"揀貨中",shipped:"已出貨",returned:"已退貨"}[s] || s; }
    function makeOrderId(name){ return `${name}-${new Date().toISOString().slice(2,10).replaceAll("-","")}-${String(state.orders.length+1).padStart(3,"0")}`; }
    function productType(product){
      return normalizeType(product.type || state.categoryOverrides[product.id]?.type || defaultProductType(product));
    }
    function normalizeType(type){
      if(!(state.hiddenCategoryOptions||[]).includes(type)) return type;
      return fallbackType(type);
    }
    function fallbackType(except){
      const options=[...DEFAULT_TYPE_OPTIONS,...(state.categoryOptions||[])].filter(c=>c && c!==except && !(state.hiddenCategoryOptions||[]).includes(c));
      return options.includes("其他訂購品") ? "其他訂購品" : (options[0] || "其他訂購品");
    }
    function defaultProductType(product){
      const name=product.name;
      const category=product.category || "";
      const soupItems=["大爺蛋素猴菇薑母鴨","大爺蛋素酸菜鴨蛋素","大爺全素何首烏1包","大爺蛋素帝王大補蛋素","大爺蛋素佛跳牆"];
      const sideDishItems=["雪裡紅5斤","菜脯5斤","筍茸5斤","皇帝菜","牛蒡絲","嫩薑","水蓮藕5斤（1個單位）","蜜汁海帶卷（5斤1個單位）","百香果木瓜（10斤1個單位）","苦瓜（時價）","香辣筍","薄鹽毛豆","花生麵筋","黃金貢饗"];
      const beanItems=["千張（5斤裝）","迷你包（5斤裝）","豆棗","皮絲5斤","切角3斤","龍珠5斤","胖輪5斤"];
      const supplyItems=["沙拉脫"];
      const sauceItems=["和風"];
      if(soupItems.includes(name)) return "湯品/鍋物";
      if(sideDishItems.includes(name)) return "小菜類";
      if(beanItems.includes(name)) return "豆製品";
      if(supplyItems.includes(name)) return "包材/耗材";
      if(sauceItems.includes(name)) return "醬料";
      if(/鬆/.test(name)) return "素鬆/鬆類";
      if(/[湯鍋羹]|四神|麻辣燙/.test(name)) return "湯品/鍋物";
      if(/豆腐|豆包|豆干|豆皮|百頁|腐竹|油泡|干絲|花干|三角|四角|豆漿|豆腱/.test(name)) return "豆製品";
      if(/丸|貢丸|火鍋料|花球|蟹球|絲丸|獅子頭/.test(name)) return "丸類/火鍋料";
      if(/排|肉|雞|鵝|腿|蹄|培根|火腿|香腸|腸|燻|素肚|素雞|植物肉|三牲|腰花/.test(name)) return "素肉/調理肉品";
      if(/魚|蝦|花枝|鮑|干貝|鱈|鮭|海味|烏魚子|鰻/.test(name)) return "海味/魚蝦類";
      if(/菇|菜|筍|蓮|藕|薑|香菜|木瓜|木耳|苦瓜|毛豆|海帶|牛蒡|雪裡紅|菜脯|珊瑚草/.test(name)) return "蔬菜/菇類";
      if(/醬|油|蠔油|香油|米豆|剝皮辣椒|罐|鹹魚/.test(name)) return "醬料";
      if(/袋|盒|瓶|橡皮筋|束繩|包材|透明|花袋/.test(name) || category.includes("公司庫存") && product.price===0) return "包材/耗材";
      if(/糕|餅|卷|瓜子|點心|抓餅/.test(name)) return "糕餅/點心";
      if(/麵|鐵板/.test(name)) return "麵食";
      if(category.includes("公司庫存")) return "公司庫存其他";
      return "其他訂購品";
    }
    function productStorage(product){
      return product.storage || state.categoryOverrides[product.id]?.storage || defaultProductStorage(product);
    }
    function defaultProductStorage(product){
      const name=product.name;
      const type=defaultProductType(product);
      const dryGoodsItems=["豆棗","皮絲5斤","切角3斤","龍珠5斤","胖輪5斤"];
      if(dryGoodsItems.includes(name)) return "乾貨";
      if(["包材/耗材","素鬆/鬆類","醬料"].includes(type)) return "乾貨";
      if(["小菜類","豆製品","蔬菜/菇類"].includes(type)) return "冷藏";
      return "冷凍";
    }
    function productGroupLabel(product){ return `${product.category || "未分類"} / ${productStorage(product)} / ${productType(product)}`; }
    function storageRank(storage){ return {冷凍:0,冷藏:1,乾貨:2}[storage] ?? 9; }
    function typeRank(type){
      const index=DEFAULT_TYPE_OPTIONS.indexOf(type);
      return index<0 ? 99 : index;
    }
    function allTypeOptions(){
      const hidden=state.hiddenCategoryOptions||[];
      return [...new Set([...DEFAULT_TYPE_OPTIONS,...(state.categoryOptions||[]),...activeProducts().map(p=>productType(p))])].filter(c=>c && !hidden.includes(c)).sort((a,b)=>typeRank(a)-typeRank(b)||a.localeCompare(b,"zh-Hant"));
    }
    function allCategoryManageOptions(){
      const hidden=state.hiddenCategoryOptions||[];
      return [...new Set([...DEFAULT_TYPE_OPTIONS,...(state.categoryOptions||[]),...activeProducts().map(p=>productType(p))])].filter(c=>c && !hidden.includes(c)).sort((a,b)=>typeRank(a)-typeRank(b)||a.localeCompare(b,"zh-Hant"));
    }
    function hiddenCategoryOptions(){
      return [...new Set(state.hiddenCategoryOptions||[])].filter(Boolean).sort((a,b)=>typeRank(a)-typeRank(b)||a.localeCompare(b,"zh-Hant"));
    }
    function setMainView(id){
      document.querySelectorAll(".main-tab").forEach(b=>b.classList.toggle("active",b.dataset.mainView===id));
      document.querySelectorAll(".main-view").forEach(v=>v.classList.toggle("active",v.id===id));
      document.querySelector(".bottom-bar").style.display = id==="orderPage" ? "flex" : "none";
      if(id==="shipPage") renderShipping();
      if(id==="returnPage") renderReturns();
    }

    function initFilters(){
      const groupLabels=[...new Set(activeProducts().sort(productSort).map(p=>productGroupLabel(p)))];
      const categories=["全部品項","冷凍","冷藏","乾貨",...groupLabels];
      document.getElementById("categoryFilter").innerHTML=categories.map(c=>`<option value="${attrText(c)}">${attrText(c)}</option>`).join("");
    }
    function visibleProducts(){
      const keyword=document.getElementById("search").value.trim().toLowerCase();
      const cat=document.getElementById("categoryFilter").value;
      return activeProducts().filter(p => p.name.toLowerCase().includes(keyword) && (cat==="全部品項" || productStorage(p)===cat || productGroupLabel(p)===cat)).sort(productSort);
    }
    function productSort(a,b){
      return catalogOrder({...a,storage:productStorage(a),type:productType(a)},{...b,storage:productStorage(b),type:productType(b)});
    }
    function productNameMarkup(name){
      const specs=[];
      const title=String(name).replace(/[（(](?:[0-9一二三四五六七八九十半兩][^()（）]*?)[)）]|\d+(?:\.\d+)?(?:台斤|公斤|公克|克|斤|包|盒|箱|片|條|顆|個|入|付|捲)(?:裝)?/g,part=>{ specs.push(part); return ""; }).replace(/\s*[=＝]\s*$/g,"").trim();
      if(!title || !specs.length) return `<h3>${attrText(name)}</h3>`;
      return `<h3>${attrText(title)}</h3><span class="item-spec">${specs.map(attrText).join(/[=＝]/.test(name)?" = ":" · ")}</span>`;
    }
    function renderProducts(){
      const grouped=new Map();
      visibleProducts().forEach(p=>{ const label=productGroupLabel(p); if(!grouped.has(label)) grouped.set(label,[]); grouped.get(label).push(p); });
      document.getElementById("productList").innerHTML=[...grouped.entries()].map(([category,items])=>`
        <section class="category"><div class="category-title"><span>${attrText(category)}</span><span class="category-count">${items.length} 項</span></div><div class="items">

    function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight){
      const words=String(text).split("");
      let line="";
      const lines=[];
      words.forEach(ch=>{
        const test=line+ch;
        if(ctx.measureText(test).width>maxWidth && line){
          lines.push(line);
          line=ch;
        }else{
          line=test;
        }
      });
      lines.push(line);
      lines.forEach((part,index)=>ctx.fillText(part,x,y+index*lineHeight));
      return Math.max(1,lines.length)*lineHeight;
    }
    function drawShareCanvas(){
      const rows=pendingOrder.items.map(item=>({
        name:itemName(item),
        price:money(itemPrice(item)),
        qty:String(item.qty)+" "+(item.unit??"件"),
        subtotal:money(itemSubtotal(item))
      }));
      const total=pendingOrder.items.reduce((sum,i)=>sum+itemSubtotal(i),0);
      const width=1000;
      const padding=40;
      const nameWidth=430;
      const lineHeight=30;
      const rowHeights=rows.map(row=>{
        const probe=document.createElement("canvas").getContext("2d");
        probe.font='26px "Microsoft JhengHei", sans-serif';
        const textWidth=probe.measureText(row.name).width;
        return Math.max(50,Math.ceil(textWidth/nameWidth)*lineHeight+18);
      });
      const height=230+rowHeights.reduce((a,b)=>a+b,0)+90;
      const canvas=document.createElement("canvas");
      canvas.width=width;
      canvas.height=height;
      const ctx=canvas.getContext("2d");
      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,width,height);
      ctx.fillStyle="#111111";
      ctx.textBaseline="top";
      ctx.font='bold 42px "Microsoft JhengHei", sans-serif';
      ctx.textAlign="center";
      ctx.fillText("福緣訂單明細",width/2,28);
      ctx.textAlign="left";
      ctx.font='26px "Microsoft JhengHei", sans-serif';
      ctx.fillText(`大名：${pendingOrder.name}`,padding,94);
      ctx.fillText(`開單時間：${pendingOrder.createdAt}`,padding,132);
      if(pendingOrder.note) ctx.fillText(`備註：${pendingOrder.note}`,padding,170);
      const tableTop=pendingOrder.note?214:180;
      const cols=[padding,padding+500,padding+660,padding+780,width-padding];
      ctx.strokeStyle="#333333";
      ctx.lineWidth=2;
      ctx.font='bold 26px "Microsoft JhengHei", sans-serif';
      ctx.fillStyle="#eeeeee";
      ctx.fillRect(padding,tableTop,width-padding*2,48);
      ctx.fillStyle="#111111";
      ctx.fillText("商品",cols[0]+12,tableTop+10);
      ctx.textAlign="right";
      ctx.fillText("單價",cols[2]-12,tableTop+10);
      ctx.fillText("數量",cols[3]-12,tableTop+10);
      ctx.fillText("總額",cols[4]-12,tableTop+10);
      ctx.textAlign="left";
      let y=tableTop+48;
      ctx.font='26px "Microsoft JhengHei", sans-serif';
      rows.forEach((row,index)=>{
        const h=rowHeights[index];
        ctx.strokeRect(padding,y,width-padding*2,h);
        [cols[1],cols[2],cols[3]].forEach(x=>{ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+h);ctx.stroke();});
        wrapCanvasText(ctx,row.name,cols[0]+12,y+10,nameWidth,lineHeight);
        ctx.textAlign="right";
        ctx.fillText(row.price,cols[2]-12,y+10);
        ctx.fillText(row.qty,cols[3]-12,y+10);
        ctx.fillText(row.subtotal,cols[4]-12,y+10);
        ctx.textAlign="left";
        y+=h;
      });
      ctx.font='bold 32px "Microsoft JhengHei", sans-serif';
      ctx.textAlign="right";
      ctx.fillStyle="#fff7ed";
      ctx.fillRect(padding,y+18,width-padding*2,64);
      ctx.strokeStyle="#f59e0b";
      ctx.strokeRect(padding,y+18,width-padding*2,64);
      ctx.fillStyle="#9a3412";
      ctx.fillText(`總金額：${money(total)}`,width-padding-18,y+34);
      return canvas;
    }
    async function shareReceiptImage(){
      if(!pendingOrder || !pendingOrder.items.length){
        alert("目前沒有可分享的訂單明細。");
        return;
      }
      try{
        const canvas=drawShareCanvas();
        const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
        const filename=`福緣訂單明細_${pendingOrder.name}_${Date.now()}.png`;
        const file=new File([blob],filename,{type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          await navigator.share({files:[file],title:"福緣訂單明細",text:`${pendingOrder.name} 訂單明細`});
        }else{
          const link=document.createElement("a");
          link.download=filename;
          link.href=URL.createObjectURL(blob);
          link.click();
          URL.revokeObjectURL(link.href);
          alert("此瀏覽器無法直接分享圖片，已改為下載明細圖片。");
        }
      }catch(error){
        alert("圖片分享未完成，可以留在此頁繼續送出訂單。");
      }
    }

      state.deletedProductIds=(state.deletedProductIds||[]).filter(x=>x!==id);
      saveState(); initFilters(); renderProducts(); renderAdmin(); alert(`${name} 已新增。`);
    }
    function renderDailySummary(){
      const byDate=new Map();
      state.orders.forEach(order=>{
        const key=dateKey(orderDate(order));
        if(!byDate.has(key)) byDate.set(key,new Map());
        const bucket=byDate.get(key);
        order.items.forEach(item=>{
          const keyItem=item.custom?`custom:${item.name}:${item.price}`:item.id;
          const existing=bucket.get(keyItem)||{name:itemName(item),type:item.custom?"客製化品項":productGroupLabel(product(item.id)),price:itemPrice(item),qty:0,total:0};
          existing.qty+=item.qty;
          existing.total+=itemSubtotal(item);
          bucket.set(keyItem,existing);
        });
      });
      const dates=[...byDate.keys()].sort().reverse();
      document.getElementById("dailySummary").innerHTML=dates.map(day=>{
        const rows=[...byDate.get(day).values()].sort((a,b)=>a.type.localeCompare(b.type,"zh-Hant")||a.name.localeCompare(b.name,"zh-Hant"));
        const dayTotal=rows.reduce((sum,row)=>sum+row.total,0);
        return `<section class="category"><div class="category-title"><span>${day} 品項合計</span><span class="category-count">${rows.length} 項 · ${money(dayTotal)}</span></div><div class="table-wrap"><table class="receipt-table"><thead><tr><th>類型</th><th>品項</th><th>單價</th><th>合計數量</th><th>金額</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${row.type}</td><td>${row.name}</td><td>${money(row.price)}</td><td>${row.qty}</td><td>${money(row.total)}</td></tr>`).join("")}</tbody></table></div></section>`;
      }).join("")||`<div class="empty">目前尚無訂單可統計。</div>`;
    }

    document.addEventListener("click", e=>{
      const inventoryPreview=e.target.closest("[data-inventory-preview]"); if(inventoryPreview){ inventoryPreview.closest(".inventory-row")?.classList.toggle("previewing"); return; }
      const imageOpen=e.target.closest("[data-image-open]"); if(imageOpen){ document.getElementById("imageModalTitle").textContent=imageOpen.dataset.imageName || "商品圖片"; const img=document.getElementById("imagePreview"); img.src=imageOpen.dataset.imageOpen || PLACEHOLDER; img.alt=imageOpen.dataset.imageName || ""; openModal("imageModal"); return; }
      const minus=e.target.closest("[data-minus]"); if(minus) setQty(minus.dataset.minus,Number(document.getElementById("qty-"+minus.dataset.minus).value||0)-1);
      const plus=e.target.closest("[data-plus]"); if(plus) setQty(plus.dataset.plus,Number(document.getElementById("qty-"+plus.dataset.plus).value||0)+1);
      const close=e.target.closest("[data-close]"); if(close) closeModal(close.dataset.close);
      const customRemove=e.target.closest("[data-custom-remove]"); if(customRemove){ customCart=customCart.filter(i=>i.id!==customRemove.dataset.customRemove); renderCustomList(); }
      const customDec=e.target.closest("[data-custom-dec]"); if(customDec){ const i=customCart.find(x=>x.id===customDec.dataset.customDec); if(i) i.qty=Math.max(1,i.qty-1); renderCustomList(); }
      const customInc=e.target.closest("[data-custom-inc]"); if(customInc){ const i=customCart.find(x=>x.id===customInc.dataset.customInc); if(i) i.qty+=1; renderCustomList(); }
      const rDec=e.target.closest("[data-receipt-dec]"); if(rDec){ const i=pendingOrder.items[Number(rDec.dataset.receiptDec)]; i.qty=Math.max(1,i.qty-1); drawReceipt(); syncPendingToPage(); }
      const rInc=e.target.closest("[data-receipt-inc]"); if(rInc){ const i=pendingOrder.items[Number(rInc.dataset.receiptInc)]; if(!i.custom && state.stock[i.id]!==null) i.qty=Math.min(state.stock[i.id],i.qty+1); else i.qty+=1; drawReceipt(); syncPendingToPage(); }
      const rRemove=e.target.closest("[data-receipt-remove]"); if(rRemove){ pendingOrder.items.splice(Number(rRemove.dataset.receiptRemove),1); drawReceipt(); syncPendingToPage(); }
      const tab=e.target.closest("[data-admin-tab]"); if(tab){ document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b===tab)); document.querySelectorAll(".admin-view").forEach(v=>v.classList.toggle("active",v.id===tab.dataset.adminTab)); }
      const mainTab=e.target.closest("[data-main-view]"); if(mainTab){setMainView(mainTab.dataset.mainView);if(mainTab.dataset.mainView!=='orderPage')refreshCloud(true).catch(e=>FuyuanCloud.notice('訂單更新失敗：'+e.message));}
      const ship=e.target.closest("[data-ship]"); if(ship){ const o=state.orders.find(x=>x.id===ship.dataset.ship); const picked=o.items.filter(i=>i.picked); const missing=o.items.filter(i=>!i.picked); if(!picked.length && !confirm("這張訂單沒有勾選任何品項，仍要完成出貨？這筆會以 0 元出貨，不扣庫存。")) return; if(missing.length && !confirm(`以下品項未出貨/缺貨，不會扣庫存也不算銷售額：\n${missing.map(i=>itemName(i)+" × "+i.qty).join("\n")}\n\n確定完成出貨？`)) return; o.status="shipped"; o.shippedAt=nowText(); picked.forEach(i=>{ if(!i.custom && state.stock[i.id]!==null) state.stock[i.id]=Math.max(0,state.stock[i.id]-i.qty); }); saveState(); renderAdmin(); renderProducts(); renderShipping(); renderReturns(); alert(`${o.id} 已完成出貨：${picked.length?picked.map(i=>itemName(i)+" × "+i.qty).join("、"):"無出貨品項"}`); }
      const completeReturn=e.target.closest("[data-complete-return]"); if(completeReturn){ const o=state.orders.find(x=>x.id===completeReturn.dataset.completeReturn); const checks=[...document.querySelectorAll(`[data-return-check="${o.id}"]:checked`)]; if(!checks.length){ alert("請至少勾選一個退貨品項。"); return; } const returned=[]; checks.forEach(ch=>{ const idx=Number(ch.dataset.index); const item=o.items[idx]; const qtyInput=document.querySelector(`[data-return-qty="${o.id}"][data-index="${idx}"]`); const max=shippedQty(item)-returnedQty(o,item); const qty=Math.max(1,Math.min(Number(qtyInput.value||1),max)); returned.push({...item,qty}); if(!item.custom && state.stock[item.id]!==null) state.stock[item.id]+=qty; }); o.returns=o.returns||[]; o.returns.push(...returned); o.status="returned"; o.returnedAt=nowText(); const hasRemaining=o.items.some(item=>shippedQty(item)-returnedQty(o,item)>0); if(!hasRemaining) o.returnClosedAt=nowText(); saveState(); renderAdmin(); renderProducts(); renderReturns(); alert(`${o.id} 已完成退貨：${returned.map(i=>itemName(i)+" × "+i.qty).join("、")}，庫存已回補。`); }
      const noReturn=e.target.closest("[data-no-return]"); if(noReturn){ const o=state.orders.find(x=>x.id===noReturn.dataset.noReturn); o.returnClosedAt=nowText(); o.returnDecision="不退貨"; saveState(); renderAdmin(); renderReturns(); alert(`${o.id} 已從退貨清單移除。`); }
      const deleteOrder=e.target.closest("[data-delete-order]"); if(deleteOrder){ const index=state.orders.findIndex(x=>x.id===deleteOrder.dataset.deleteOrder); if(index<0) return; const o=state.orders[index]; if(!confirm(`確定刪除 ${o.id}？這筆明細會從後台移除。`)) return; if(o.status==="shipped"||o.status==="returned"){ o.items.forEach(i=>{ if(!i.custom && state.stock[i.id]!==null) state.stock[i.id]+=shippedQty(i); }); (o.returns||[]).forEach(i=>{ if(!i.custom && state.stock[i.id]!==null) state.stock[i.id]=Math.max(0,state.stock[i.id]-i.qty); }); } state.orders.splice(index,1); saveState(); renderAdmin(); renderShipping(); renderReturns(); renderProducts(); alert(`${o.id} 已刪除。`); }
      const stockDec=e.target.closest("[data-stock-dec]"); if(stockDec){ if(state.stock[stockDec.dataset.stockDec]===null) state.stock[stockDec.dataset.stockDec]=0; state.stock[stockDec.dataset.stockDec]=Math.max(0,state.stock[stockDec.dataset.stockDec]-1); saveState(); renderAdmin(); renderProducts(); }
      const stockInc=e.target.closest("[data-stock-inc]"); if(stockInc){ if(state.stock[stockInc.dataset.stockInc]===null) state.stock[stockInc.dataset.stockInc]=0; state.stock[stockInc.dataset.stockInc]+=1; saveState(); renderAdmin(); renderProducts(); }
      const deleteProduct=e.target.closest("[data-delete-product]"); if(deleteProduct){ const p=product(deleteProduct.dataset.deleteProduct); if(!confirm(`確定刪除品項「${p.name}」？舊訂單仍會保留這個品項名稱。`)) return; state.deletedProductIds=[...new Set([...(state.deletedProductIds||[]),p.id])]; delete standardCart[p.id]; saveState(); initFilters(); renderProducts(); renderAdmin(); }
      if(e.target.id==="addProductBtn") addManagedProduct();
      if(e.target.id==="addCategoryOption"){ const input=document.getElementById("newCategoryOption"); const value=input.value.trim(); if(!value){ alert("請輸入分類名稱。"); return; } state.hiddenCategoryOptions=(state.hiddenCategoryOptions||[]).filter(c=>c!==value); if(!state.categoryOptions.includes(value) && !DEFAULT_TYPE_OPTIONS.includes(value)) state.categoryOptions.push(value); input.value=""; saveState(); initFilters(); renderProducts(); renderAdmin(); }
      if(e.target.id==="deleteCategoryOptionBtn"){ const select=document.getElementById("deleteCategoryOption"); const value=select?.value; if(!value) return; const nextType=fallbackType(value); if(!confirm(`確定刪除分類「${value}」？使用此分類的品項會改到「${nextType}」。`)) return; state.categoryOptions=state.categoryOptions.filter(c=>c!==value); state.hiddenCategoryOptions=[...new Set([...(state.hiddenCategoryOptions||[]),value])]; Object.entries(state.categoryOverrides).forEach(([id,setting])=>{ if(setting.type===value){ state.categoryOverrides[id]={...setting,type:nextType}; } }); activeProducts().forEach(p=>{ if(defaultProductType(p)===value && !state.categoryOverrides[p.id]) state.categoryOverrides[p.id]={storage:productStorage(p),type:nextType}; }); saveState(); initFilters(); renderProducts(); renderAdmin(); }
      if(e.target.id==="restoreCategoryOptionBtn"){ const select=document.getElementById("restoreCategoryOption"); const value=select?.value; if(!value) return; state.hiddenCategoryOptions=(state.hiddenCategoryOptions||[]).filter(c=>c!==value); saveState(); initFilters(); renderProducts(); renderAdmin(); }
    });

    document.addEventListener("input", e=>{
      if(e.target.matches("[data-qty]")) setQty(e.target.dataset.qty,e.target.value);
      if(e.target.id==="search") renderProducts();
      if(e.target.id==="inventorySearch"){ inventoryKeyword=e.target.value; applyInventorySearch(); }
      if(e.target.matches("[data-stock-input]")){ state.stock[e.target.dataset.stockInput]=Math.max(0,Number(e.target.value||0)); saveState(); renderAdmin(); renderProducts(); }
    });
    document.addEventListener("change", e=>{
      const pick=e.target.closest("[data-pick]");
      if(pick){ const o=state.orders.find(x=>x.id===pick.dataset.pick); const i=o.items.find(x=>x.id===pick.dataset.product); i.picked=pick.checked; o.status=o.items.some(x=>x.picked)?"picking":"new"; saveState(); renderAdmin(); renderShipping(); }
      const storageSelect=e.target.closest("[data-storage-select]"); if(storageSelect){ const id=storageSelect.dataset.storageSelect; state.categoryOverrides[id]={...(state.categoryOverrides[id]||{}),storage:storageSelect.value,type:state.categoryOverrides[id]?.type || productType(product(id))}; saveState(); initFilters(); renderProducts(); renderAdmin(); }
      const typeSelect=e.target.closest("[data-type-select]"); if(typeSelect){ const id=typeSelect.dataset.typeSelect; state.categoryOverrides[id]={...(state.categoryOverrides[id]||{}),storage:state.categoryOverrides[id]?.storage || productStorage(product(id)),type:typeSelect.value}; saveState(); initFilters(); renderProducts(); renderAdmin(); }
      const priceInput=e.target.closest("[data-price-input]"); if(priceInput){ const id=priceInput.dataset.priceInput; state.productEdits[id]={...(state.productEdits[id]||{}),price:Math.max(0,Number(priceInput.value||0))}; saveState(); renderProducts(); renderAdmin(); }
      const imageInput=e.target.closest("[data-image-input]"); if(imageInput){ saveProductImage(imageInput.dataset.imageInput,imageInput.value.trim()); }
      const imageFile=e.target.closest("[data-image-file]"); if(imageFile){ readImageFile(imageFile.files?.[0],data=>saveProductImage(imageFile.dataset.imageFile,data)); }
      if(e.target.id==="newProductFile"){ readImageFile(e.target.files?.[0],data=>{ document.getElementById("newProductImage").value=data; }); }
    });
    document.getElementById("categoryFilter").addEventListener("change",renderProducts);
    document.getElementById("addCustom").addEventListener("click",()=>{
      const name=document.getElementById("customName").value.trim();
      const price=Number(document.getElementById("customPrice").value||0);
      const qty=Math.max(1,Number(document.getElementById("customQty").value||1));
      if(!name){ alert("請輸入客製化品名。"); return; }
      customCart.push({id:"custom-"+Date.now(),custom:true,name,price,qty});
      document.getElementById("customName").value=""; document.getElementById("customPrice").value=""; document.getElementById("customQty").value=1;
      renderCustomList();
    });
    document.getElementById("openAdmin").addEventListener("click",()=>openModal("adminLogin"));
    document.getElementById("loginAdmin").addEventListener("click",()=>location.assign(FuyuanCloud.ADMIN));
    document.getElementById("checkout").addEventListener("click",()=>{ if(!document.getElementById("customerName").value.trim()){ alert("請先輸入大名。"); return; } if(!cartItems().length){ alert("請至少選擇一個品項。"); return; } renderReceipt(); openModal("receiptModal"); });
    document.getElementById("printReceipt").addEventListener("click",()=>{ window.print(); });
    document.getElementById("shareReceiptImage").addEventListener("click",shareReceiptImage);
    document.getElementById("saveOrder").addEventListener("click",()=>{
      if(!pendingOrder.items.length){ alert("訂單沒有品項，請返回修改。"); return; }
      const order={ id:makeOrderId(pendingOrder.name), name:pendingOrder.name, note:pendingOrder.note, items:pendingOrder.items.map(i=>({...i,picked:false})), status:"new", returns:[], createdAt:pendingOrder.createdAt || nowText(), createdAtISO:pendingOrder.createdAtISO || new Date().toISOString() };
      state.orders.unshift(order); saveState(); clearCart(); closeModal("receiptModal"); alert(`${order.id} 已送出。`);
    });

    // Preserve the existing order/shipping/return interface while all writes use
    // the same API as backstage and customer. Legacy localStorage is untouched.
    let cloudBusy=false,refreshingCloud=false,cloudRequestId=null;
    function normalizeCloudOrders(orders){return orders.filter(o=>!o.archivedAt).map(o=>({...o,createdAtISO:o.createdAt,createdAt:new Date(o.createdAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}),items:o.items.map(i=>({...i,custom:!!i.custom,picked:i.picked??(['shipped','returned'].includes(o.status))})),returns:(o.returns||[]).map(i=>({...i,custom:!!i.custom}))}));}
    async function refreshCloud(force=false){
      if(refreshingCloud||(!force&&(cloudBusy||document.getElementById('receiptModal').classList.contains('show'))))return;
      refreshingCloud=true;
      try{const [nextProducts,nextOrders]=await Promise.all([FuyuanCloud.products('order'),FuyuanCloud.request('/staff/orders')]);const filter=document.getElementById('categoryFilter').value;PRODUCTS.splice(0,PRODUCTS.length,...nextProducts);state.stock=Object.fromEntries(PRODUCTS.map(p=>[p.id,p.stock]));state.categoryOverrides=Object.fromEntries(PRODUCTS.map(p=>[p.id,{storage:p.storage,type:p.type}]));state.orders=normalizeCloudOrders(nextOrders);for(const id of Object.keys(standardCart)){const p=PRODUCTS.find(p=>p.id===id&&p.orderVisible);if(!p)delete standardCart[id];else if(p.stock!==null)standardCart[id]=Math.min(standardCart[id],p.stock);}initFilters();if([...document.getElementById('categoryFilter').options].some(o=>o.value===filter))document.getElementById('categoryFilter').value=filter;
        document.getElementById('orderSyncStatus').textContent='訂單更新於 '+new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei'});
        // Polling must not clear the return selections currently being entered.
        const returnDrafts=force?[]:[...document.querySelectorAll('#returnPage input')].map(input=>({order:input.dataset.returnCheck||input.dataset.returnQty,index:input.dataset.index,check:input.type==='checkbox',checked:input.checked,value:input.value}));
        renderProducts();renderShipping();renderReturns();
        for(const draft of returnDrafts){const input=document.querySelector(`[${draft.check?'data-return-check':'data-return-qty'}="${draft.order}"][data-index="${draft.index}"]`);if(input){if(draft.check)input.checked=draft.checked;else input.value=Math.max(1,Math.min(Number(draft.value)||1,Number(input.max)||1));}}
      }
      finally{refreshingCloud=false;}

    }
    function confirmCloud(message){
      return new Promise(resolve=>{const dialog=document.createElement('dialog');dialog.style.cssText='max-width:560px;width:90%;border:1px solid #cbd5e1;border-radius:14px;padding:26px;color:#1f2937;font:20px/1.7 sans-serif';const heading=document.createElement('h2');heading.textContent='確認訂單操作';const messageNode=document.createElement('p');messageNode.textContent=message;const cancel=document.createElement('button');cancel.textContent='返回';cancel.className='secondary';const ok=document.createElement('button');ok.textContent='確認';ok.className='primary';const actions=document.createElement('div');actions.className='actions';actions.append(cancel,ok);dialog.append(heading,messageNode,actions);document.body.append(dialog);let answer=false;cancel.onclick=()=>dialog.close();ok.onclick=()=>{answer=true;dialog.close();};dialog.onclose=()=>{dialog.remove();resolve(answer);};dialog.showModal();});
    }
    async function cloudAction(action){if(cloudBusy){FuyuanCloud.notice('正在同步，請稍候再操作。');return;}cloudBusy=true;try{await action();await refreshCloud(true);}catch(e){FuyuanCloud.notice(e.message);try{await refreshCloud(true);}catch{}}finally{cloudBusy=false;}}
    document.addEventListener('click',e=>{
      const b=e.target.closest('#saveOrder,#openAdmin,#loginAdmin,[data-ship],[data-complete-return],[data-no-return],[data-delete-order]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
      if(b.id==='openAdmin'||b.id==='loginAdmin'){location.assign(FuyuanCloud.ADMIN);return;}
      cloudAction(async()=>{
        if(b.id==='saveOrder'){
          if(!pendingOrder?.items.length)throw Error('請至少選擇一個品項。');pendingOrder.cloudRequestId??=cloudRequestId||FuyuanCloud.random();cloudRequestId=pendingOrder.cloudRequestId;
          const o=await FuyuanCloud.place({requestId:pendingOrder.cloudRequestId,channel:'order',name:pendingOrder.name,phone:'',note:pendingOrder.note,items:pendingOrder.items.map(i=>({id:i.id,name:i.custom?i.name:product(i.id).name,custom:!!i.custom,qty:i.qty,price:itemPrice(i),unit:i.unit??"件"}))});cloudRequestId=null;clearCart();pendingOrder=null;closeModal('receiptModal');FuyuanCloud.notice('訂單 '+orderLabel(o.id)+' 已送至共用後台。');return;
        }
        const id=b.dataset.ship||b.dataset.completeReturn||b.dataset.noReturn||b.dataset.deleteOrder,o=state.orders.find(o=>o.id===id);if(!o)throw Error('訂單已更新，請重新整理。');
        if(b.dataset.ship){const missing=o.items.filter(i=>!i.picked);if(missing.length&&!await confirmCloud(`本次有 ${missing.length} 項未勾選，不會出貨。確認完成出貨並釋放這些品項的預留庫存？`))return;await FuyuanCloud.request('/staff/orders/'+encodeURIComponent(id),'PATCH',{action:'ship',revision:o.revision,pickedIds:o.items.filter(i=>i.picked).map(i=>i.id)});FuyuanCloud.notice('已完成出貨；未出貨品項的預留庫存已釋放。');}
        if(b.dataset.completeReturn){const items=[...document.querySelectorAll(`[data-return-check="${id}"]:checked`)].map(ch=>({id:o.items[Number(ch.dataset.index)].id,qty:Number(document.querySelector(`[data-return-qty="${id}"][data-index="${ch.dataset.index}"]`).value)}));if(!items.length)throw Error('請勾選退貨品項。');await FuyuanCloud.request('/staff/orders/'+encodeURIComponent(id),'PATCH',{action:'return',revision:o.revision,items});FuyuanCloud.notice('退貨已同步，庫存已回補。');}
        if(b.dataset.noReturn){await FuyuanCloud.request('/staff/orders/'+encodeURIComponent(id),'PATCH',{action:'closeReturn',revision:o.revision});FuyuanCloud.notice('此訂單退貨處理已結案。');}
        if(b.dataset.deleteOrder){if(!await confirmCloud(['new','picking'].includes(o.status)?'確認取消這筆訂單並回補預留庫存？':'確認封存這筆明細？歷史銷售紀錄仍保留於後台。'))return;await FuyuanCloud.request('/staff/orders/'+encodeURIComponent(id),'PATCH',{action:['new','picking'].includes(o.status)?'cancel':'archive',revision:o.revision});FuyuanCloud.notice('訂單已取消或封存，歷史紀錄仍保留於共用後台。');}
      });
    },true);
    document.addEventListener('change',e=>{const pick=e.target.closest('[data-pick]');if(!pick)return;e.stopImmediatePropagation();const id=pick.dataset.pick,itemId=pick.dataset.product,picked=pick.checked;cloudAction(async()=>{const o=state.orders.find(o=>o.id===id);await FuyuanCloud.request('/staff/orders/'+encodeURIComponent(id),'PATCH',{action:'pick',revision:o.revision,itemId,picked});});},true);
    setInterval(()=>{if(!document.hidden&&!document.activeElement?.matches('[data-qty]'))refreshCloud().catch(e=>FuyuanCloud.notice(e.message));},15000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCloud().catch(e=>FuyuanCloud.notice(e.message));});

    document.getElementById('refreshOrders').onclick=()=>refreshCloud(true).catch(e=>FuyuanCloud.notice('訂單更新失敗：'+e.message));
    window.addEventListener('storage',e=>{if(e.key==='fuyuan-orders-updated')refreshCloud().catch(error=>FuyuanCloud.notice(error.message));});
    FuyuanCloud.notice('已連接共用資料庫，價格、庫存與訂單會自動同步。');

    initFilters(); renderProducts(); renderCustomList();
  </script>
